name: Review bot

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # every 10 min (GitHub can start scheduled runs a few minutes late); the daily review goes out on the first run after the reminder hour (IST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/run.request"]

permissions:
  contents: write

concurrency:
  group: mtrx-bot
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Build question banks from the guides
        run: python3 tools/build_questions.py
      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot/bot.py
      - name: Save state
        run: |
          bash tools/commit_state.sh "bot review state"
