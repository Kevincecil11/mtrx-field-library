name: Guide build
# Renders guide parts from small source files in build/ and commits the result.
# Lets an AI update a big guide without pushing the whole HTML. See build/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '!build/out/**'
      - '.github/workflows/guide-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guide-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install beautifulsoup4==4.12.3
      - name: Build, lint, skeleton
        run: python build/run.py
      - name: Commit the guide and build notes
        run: |
          git config user.name "mtrx-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides build/out
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "guide build: $(head -c 120 build/out/LAST_BUILD.txt) [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 7
          done
          exit 1
