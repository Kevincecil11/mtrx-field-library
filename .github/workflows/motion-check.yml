name: Scroll motion checks
on:
  push:
    paths:
      - 'assets/mtrx-scroll.js'
      - 'assets/mtrx-review.js'
      - 'index.html'
      - 'guides/*.html'
      - 'tests/test_scroll_motion.cjs'
      - '.github/workflows/motion-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check shared scripts
        run: |
          node --check assets/mtrx-scroll.js
          node --check assets/mtrx-review.js
      - name: Install pinned browser and motion packages
        run: |
          npm install --prefix "$RUNNER_TEMP/mtrx-motion" --no-save playwright@1.55.1 gsap@3.13.0 lenis@1.3.11
          "$RUNNER_TEMP/mtrx-motion/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check real library and guide interactions
        run: |
          export NODE_PATH="$RUNNER_TEMP/mtrx-motion/node_modules"
          node tests/test_scroll_motion.cjs
      - name: Keep desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scroll-motion-screenshots
          path: motion-screenshots/
          if-no-files-found: ignore
